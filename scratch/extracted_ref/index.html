<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
    <title>Sistem Manajemen Lembaga</title>
    <script>
      // Prevent third-party or sandbox script errors on window.fetch assignment
      try {
        const originalFetch = window.fetch;
        if (originalFetch) {
          Object.defineProperty(window, 'fetch', {
            get() { return originalFetch; },
            set(val) { console.warn("Attempted to set window.fetch - ignored:", val); },
            configurable: true,
            enumerable: true
          });
        }
      } catch (e) {
        console.warn("Could not define custom setter for window.fetch:", e);
      }

      // Suppress fetch getter TypeErrors globally to keep the app flawless
      window.addEventListener('error', function(event) {
        const msg = (event.message || '').toLowerCase();
        const errStr = (event.error && event.error.message || '').toLowerCase();
        if (msg.includes('fetch') && msg.includes('getter') || errStr.includes('fetch') && errStr.includes('getter')) {
          console.warn("Suppressed fetch getter TypeError:", event.message || event.error);
          event.preventDefault();
          return true;
        }
      });
    </script>
      <script>
      // Scrub localStorage of corrupted JSON strings before the app loads
      try {
        const keysToRemove = [];
        for (let i = 0; i < localStorage.length; i++) {
          const key = localStorage.key(i);
          if (key) {
            const val = localStorage.getItem(key);
            if (val === null) continue;
            const trimmed = val.trim();
            if (trimmed === 'undefined' || trimmed === 'null' || trimmed === '' || trimmed === '"undefined"' || trimmed === '"null"') {
              keysToRemove.push(key);
            } else if (trimmed.startsWith('{') || trimmed.startsWith('[')) {
              try {
                JSON.parse(trimmed);
              } catch (e) {
                keysToRemove.push(key);
              }
            }
          }
        }
        keysToRemove.forEach(key => localStorage.removeItem(key));
      } catch (e) {
        console.warn("Storage scrub failed:", e);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
